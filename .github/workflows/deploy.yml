name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # GH_PAGES=true switches the build to base /mlsc-view/, a Node server
      # bundle, and prerendering of every route to static HTML (.output/public).
      - name: Build static site
        env:
          GH_PAGES: "true"
        run: bun run build

      - name: Prepare static output for GitHub Pages
        run: |
          cp -r .output/public ./dist-pages
          # SPA-style fallback: serve the homepage shell for unknown deep links
          cp ./dist-pages/index.html ./dist-pages/404.html 2>/dev/null || true
          # Prevent Jekyll processing (keeps _* asset folders working)
          touch ./dist-pages/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
